<html lang="es">
<head>

  <title>Jorgito - Catálogo</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Sora:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * { font-family: 'Sora', sans-serif; }
    h1, h2, h3, h4, h5, h6 { font-family: 'Space Grotesk', sans-serif; }
    :root { --primary: #0F0F1E; --primary-light: #1a1a2e; --accent-cyan: #00D9FF; --accent-magenta: #FF1B6D; --accent-mint: #06D6A0; --bg-light: #F8F8FB; --bg-white: #FFFFFF; --text-dark: #0F0F1E; --text-gray: #4A4A4A; --border-light: #E5E5F0; }
    body { background: linear-gradient(135deg, var(--bg-light) 0%, #F0E6FF 100%); min-height: 100vh; color: var(--text-dark); }
    .header-gradient { background: linear-gradient(135deg, var(--primary) 0%, var(--primary-light) 100%); position: relative; overflow: hidden; }
    .header-gradient::before { content: ''; position: absolute; top: -50%; right: -10%; width: 500px; height: 500px; background: radial-gradient(circle, rgba(0, 217, 255, 0.1) 0%, transparent 70%); border-radius: 50%; pointer-events: none; }
    .header-content { position: relative; z-index: 1; }
    .logo-section { background: linear-gradient(135deg, var(--accent-cyan) 0%, var(--accent-magenta) 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
    .cart-btn { background: linear-gradient(135deg, var(--accent-mint) 0%, var(--accent-cyan) 100%); position: relative; overflow: visible; transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1); box-shadow: 0 8px 24px rgba(6, 214, 160, 0.25); }
    .cart-btn:hover { transform: translateY(-2px); box-shadow: 0 12px 32px rgba(0, 217, 255, 0.35); }
    .cart-count { position: absolute; top: -10px; right: -10px; background: linear-gradient(135deg, var(--accent-magenta) 0%, #FF6B9D 100%); color: white; width: 26px; height: 26px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 0.7rem; box-shadow: 0 4px 12px rgba(255, 27, 109, 0.4); z-index: 10; pointer-events: none; }
    .category-filter { display: flex; gap: 0.75rem; flex-wrap: wrap; padding: 1.5rem; background: var(--bg-white); border-radius: 2rem; border: 1px solid var(--border-light); backdrop-filter: blur(10px); margin-bottom: 1.5rem; }
    .cat-btn { padding: 0.625rem 1.25rem; border-radius: 1.5rem; font-weight: 600; font-size: 0.875rem; border: 1px solid var(--border-light); transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1); background: var(--bg-light); color: var(--text-gray); cursor: pointer; position: relative; overflow: hidden; }
    .cat-btn::before { content: ''; position: absolute; top: 0; left: -100%; width: 100%; height: 100%; background: linear-gradient(90deg, var(--accent-cyan), var(--accent-magenta)); z-index: -1; transition: left 0.3s; }
    .cat-btn.active { color: white; border: none; position: relative; z-index: 1; }
    .cat-btn.active::before { left: 0; }
    
    /* ----- ESTILOS DE GRILLA RESPONSIVA (scroll vertical) ----- */
    .products-grid {
      display: grid;
      gap: 1.5rem;
      /* Por defecto en móviles pequeños: 2 columnas */
      grid-template-columns: repeat(2, 1fr);
    }
    /* Para móviles más grandes (≥480px): 3 columnas */
    @media (min-width: 480px) {
      .products-grid {
        grid-template-columns: repeat(3, 1fr);
      }
    }
    /* Para tablets (≥768px): 4 columnas */
    @media (min-width: 768px) {
      .products-grid {
        grid-template-columns: repeat(4, 1fr);
      }
    }
    /* Para desktop (≥1024px): 4 o 5 columnas según espacio */
    @media (min-width: 1024px) {
      .products-grid {
        grid-template-columns: repeat(5, 1fr);
      }
    }
    /* Pantallas muy grandes: fijamos máximo 5 columnas para no estirar demasiado */
    @media (min-width: 1440px) {
      .products-grid {
        grid-template-columns: repeat(5, minmax(0, 280px));
        justify-content: center;
      }
    }

    .product-card {
      background: var(--bg-white);
      border-radius: 1.5rem;
      overflow: hidden;
      border: 1px solid var(--border-light);
      transition: all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
      display: flex;
      flex-direction: column;
      height: 100%;
      animation: fadeInUp 0.5s ease-out forwards;
    }
    .product-card:hover {
      transform: translateY(-8px);
      border-color: var(--accent-cyan);
      box-shadow: 0 20px 40px rgba(0, 217, 255, 0.15);
    }
    .product-image {
      position: relative;
      width: 100%;
      aspect-ratio: 1 / 1; /* Cuadrado para mantener consistencia */
      background: linear-gradient(135deg, #F0E6FF 0%, #E8F3FF 100%);
      overflow: hidden;
      cursor: pointer;
    }
    .product-image img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    .product-card:hover .product-image img {
      transform: scale(1.05);
    }
    .product-badge {
      position: absolute;
      top: 0.75rem;
      right: 0.75rem;
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(10px);
      padding: 0.3rem 0.75rem;
      border-radius: 1rem;
      font-size: 0.7rem;
      font-weight: 600;
      color: var(--accent-magenta);
      white-space: nowrap;
    }
    .product-content {
      padding: 1rem;
      flex: 1;
      display: flex;
      flex-direction: column;
    }
    .product-header {
      margin-bottom: 0.5rem;
    }
    .product-name {
      font-weight: 700;
      font-size: 0.9rem;
      line-height: 1.3;
      color: var(--text-dark);
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .product-description {
      font-size: 0.75rem;
      color: var(--text-gray);
      margin-bottom: 0.5rem;
      line-height: 1.3;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .oferta-badge {
      background: linear-gradient(135deg, #FFF9E6 0%, #FFEFCC 100%);
      color: #8B6914;
      font-size: 0.7rem;
      font-weight: 600;
      padding: 0.3rem 0.6rem;
      border-radius: 0.75rem;
      margin: 0.5rem 0;
      border-left: 3px solid #FFB800;
      display: inline-block;
      width: fit-content;
    }
    .product-price {
      font-size: 1.3rem;
      font-weight: 800;
      background: linear-gradient(135deg, var(--accent-magenta), var(--accent-cyan));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin: 0.5rem 0;
    }
    .talle-selector {
      margin: 0.5rem 0;
      display: flex;
      flex-direction: column;
      gap: 0.3rem;
    }
    .talle-selector label {
      font-size: 0.7rem;
      font-weight: 600;
      color: var(--text-gray);
    }
    .talle-selector select {
      padding: 0.5rem;
      border: 1px solid var(--border-light);
      border-radius: 0.75rem;
      font-size: 0.8rem;
      background: var(--bg-light);
      color: var(--text-dark);
      cursor: pointer;
    }
    .qty-control {
      display: flex;
      align-items: center;
      gap: 0.25rem;
      background: var(--bg-light);
      border-radius: 1rem;
      padding: 0.2rem;
      border: 1px solid var(--border-light);
    }
    .qty-btn {
      width: 32px;
      height: 32px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: transparent;
      border: none;
      cursor: pointer;
      font-weight: 700;
      color: var(--primary);
      font-size: 1rem;
      border-radius: 0.75rem;
    }
    .qty-btn:hover {
      background: white;
      color: var(--accent-magenta);
    }
    .qty-input {
      width: 40px;
      text-align: center;
      font-weight: 700;
      background: transparent;
      border: none;
      font-size: 0.85rem;
    }
    .add-btn {
      background: linear-gradient(135deg, var(--primary) 0%, var(--primary-light) 100%);
      color: white;
      font-weight: 700;
      padding: 0.6rem 0.5rem;
      border-radius: 1rem;
      border: none;
      cursor: pointer;
      transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
      margin-top: 0.75rem;
      font-size: 0.8rem;
      position: relative;
      overflow: hidden;
    }
    .add-btn::before {
      content: '';
      position: absolute;
      top: 0;
      left: -100%;
      width: 100%;
      height: 100%;
      background: linear-gradient(90deg, rgba(0, 217, 255, 0.3), rgba(255, 27, 109, 0.3));
      transition: left 0.3s;
      z-index: 0;
    }
    .add-btn span {
      position: relative;
      z-index: 1;
    }
    .add-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 16px rgba(15, 15, 30, 0.25);
    }
    .add-btn:hover::before {
      left: 100%;

    /* Offcanvas y modal (sin cambios) */
    .offcanvas { position: fixed; top: 0; right: -450px; width: 100%; max-width: 450px; height: 100vh; background: white; z-index: 1050; transition: right 0.3s cubic-bezier(0.34, 1.56, 0.64, 1); display: flex; flex-direction: column; box-shadow: -8px 0 32px rgba(0, 0, 0, 0.15); }
    .offcanvas.open { right: 0; }
    .offcanvas-header { background: linear-gradient(135deg, var(--primary) 0%, var(--primary-light) 100%); color: white; padding: 1.5rem; display: flex; justify-content: space-between; align-items: center; }

    .close-btn { background: none; border: none; color: white; font-size: 1.5rem; cursor: pointer; padding: 0.5rem; }
    .cart-items { flex: 1; overflow-y: auto; padding: 1.5rem; }
    .cart-item { display: flex; gap: 1rem; border-bottom: 1px solid var(--border-light); padding: 1rem 0; position: relative; }

    .cart-item-content { flex: 1; }

    .cart-item-price { font-size: 0.8rem; color: var(--accent-magenta); font-weight: 600; }
    .cart-item-qty { font-size: 0.75rem; color: var(--text-gray); }
    .remove-btn { background: rgba(255, 27, 109, 0.1); border: none; color: var(--accent-magenta); width: 30px; height: 30px; border-radius: 0.5rem; cursor: pointer; font-weight: 700; }
    .remove-btn:hover { background: var(--accent-magenta); color: white; }
    .empty-cart { text-align: center; color: var(--text-gray); padding: 2rem; }
    .cart-footer { padding: 1.5rem; border-top: 1px solid var(--border-light); }
    .cart-info { text-align: center; font-size: 0.75rem; background: var(--bg-light); border-radius: 1rem; padding: 0.75rem; margin-bottom: 1rem; }
    .cart-total { display: flex; justify-content: space-between; font-weight: 800; margin-bottom: 1rem; }
    .whatsapp-btn { width: 100%; padding: 0.8rem; background: linear-gradient(135deg, #25D366 0%, #06D6A0 100%); color: white; border: none; border-radius: 1rem; font-weight: 700; cursor: pointer; }
    .offcanvas-backdrop { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.4); z-index: 1040; display: none; backdrop-filter: blur(4px); }
    .offcanvas-backdrop.show { display: block; }
    .image-modal { display: none; position: fixed; z-index: 1100; left: 0; top: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.9); align-items: center; justify-content: center; backdrop-filter: blur(10px); }
    .image-modal img { max-width: 90%; max-height: 90%; object-fit: contain; border-radius: 1rem; }
    .modal-back-btn { position: absolute; top: 1rem; left: 1rem; background: white; border: none; padding: 0.5rem 1rem; border-radius: 1.5rem; font-weight: 700; cursor: pointer; }
    @keyframes fadeInUp { from { opacity: 0; transform: translateY(15px); } to { opacity: 1; transform: translateY(0); } }
  </style>

let filteredProducts = [], currentCategory = "all", cart = {};
function formatPrice(p) { let n = parseFloat(p); return isNaN(n) ? "$0" : "$" + n.toLocaleString('es-ES'); }
function escapeHtml(s) { if (!s) return ""; return s.replace(/[&<>]/g, m => m === '&' ? '&amp;' : m === '<' ? '&lt;' : '&gt;'); }
function updateCartUI() { document.getElementById("cartCount").innerText = Object.values(cart).reduce((s, i) => s + i.cantidad, 0); renderCartOffcanvas(); }
function addToCart(id, nombre, precio, imagen, cant, talle, categoria) { if (cant <= 0) return; let key = talle ? id + "_" + talle : id; if (cart[key]) cart[key].cantidad += cant; else cart[key] = { idOriginal: id, nombre, precio, cantidad: cant, imagen, talle, categoria }; updateCartUI(); }
function removeProductFromCart(key) { if (cart[key]) { delete cart[key]; updateCartUI(); } }
function removeOneFromCart(key) { if (cart[key]) { if (cart[key].cantidad > 1) cart[key].cantidad--; else delete cart[key]; updateCartUI(); } }
function renderCartOffcanvas() {
  let container = document.getElementById("cartItemsList"), items = Object.values(cart);
  if (!items.length) { container.innerHTML = '<div class="empty-cart">🛒 Tu carrito está vacío</div>'; document.getElementById("cartTotal").innerText = formatPrice(0); return; }
  let html = "", total = 0;
  for (let [key, item] of Object.entries(cart)) { let sub = item.precio * item.cantidad; total += sub; let talleInfo = item.talle ? " | Talle: " + escapeHtml(item.talle) : ""; let categoriaInfo = item.categoria ? `<div class="cart-item-category">📁 ${escapeHtml(item.categoria)}</div>` : ""; html += `<div class="cart-item"><img src="${escapeHtml(item.imagen)}" class="cart-item-image"><div class="cart-item-content"><div class="cart-item-title">${escapeHtml(item.nombre)}${talleInfo}</div>${categoriaInfo}<div class="cart-item-price">${formatPrice(item.precio)}</div><div class="cart-item-qty">Cantidad: ${item.cantidad} × ${formatPrice(sub)}</div><button class="remove-btn remove-one-btn" data-key="${key}">−</button></div><button class="remove-btn remove-product-btn" data-key="${key}" style="position: absolute; top: 0.5rem; right: 0.5rem;">✕</button></div>`; }
  container.innerHTML = html; document.getElementById("cartTotal").innerText = formatPrice(total);
  document.querySelectorAll('.remove-one-btn').forEach(b => b.addEventListener('click', () => removeOneFromCart(b.dataset.key)));
  document.querySelectorAll('.remove-product-btn').forEach(b => b.addEventListener('click', () => removeProductFromCart(b.dataset.key)));
}
function generateWhatsAppMessage() { let items = Object.values(cart); if (!items.length) return null; let msg = `¡Hola ${STORE_NAME}! Quisiera hacer un pedido:%0A%0A`, total = 0; items.forEach(i => { let sub = i.precio * i.cantidad; total += sub; let talleTexto = i.talle ? " (Talle: " + i.talle + ")" : ""; let catTexto = i.categoria ? " [Categoría: " + i.categoria + "]" : ""; msg += `🔹 ${i.nombre}${talleTexto}${catTexto}%0A   Cantidad: ${i.cantidad} x ${formatPrice(i.precio)}%0A   Subtotal: ${formatPrice(sub)}%0A%0A`; }); msg += `📊 Total: ${formatPrice(total)}%0A%0AEspero tu confirmación. ¡Gracias!`; return msg; }
function sendWhatsApp() { let m = generateWhatsAppMessage(); if (m) window.open(`https://wa.me/${WHATSAPP_NUMBER}?text=${m}`, '_blank'); else alert("El carrito está vacío"); }
function openImageModal(src) { let m = document.getElementById("imageModal"); m.style.display = "flex"; document.getElementById("modalImage").src = src; }
function closeImageModal() { document.getElementById("imageModal").style.display = "none"; }
function applyFiltersAndRender() {
  let result = [...allProducts]; if (currentCategory !== "all") result = result.filter(p => p.categoria === currentCategory); filteredProducts = result;
  let grid = document.getElementById("productsGrid");
  if (!filteredProducts.length) { grid.innerHTML = '<div class="col-span-full text-center py-20 text-gray-400"><p class="text-lg">📭 Sin productos en esta categoría</p></div>'; return; }
  let html = "";
  filteredProducts.forEach((p, idx) => { let qid = `qty_${p.id}`; let talleSelectorHtml = ""; if (p.talles && p.talles.length > 0) { let options = p.talles.map(t => `<option value="${escapeHtml(t)}">Talle ${escapeHtml(t)}</option>`).join(''); talleSelectorHtml = `<div class="talle-selector"><label>Selecciona talle:</label><select class="talle-select w-full" data-id="${p.id}" id="talle_${p.id}">${options}</select></div>`; } let ofertaHtml = (p.oferta && p.oferta.trim() !== "") ? `<div class="oferta-badge">🎉 ${escapeHtml(p.oferta)}</div>` : ""; let descripcionHtml = (p.descripcion && p.descripcion.trim() !== "") ? `<div class="product-description">${escapeHtml(p.descripcion)}</div>` : ""; html += `<div class="product-card" style="animation-delay: ${idx * 0.05}s;"><div class="product-image" onclick="openImageModal('${escapeHtml(p.imagen)}')"><img src="${escapeHtml(p.imagen)}" loading="lazy"><div class="product-badge">${escapeHtml(p.categoria)}</div></div><div class="product-content"><div class="product-header"><h3 class="product-name">${escapeHtml(p.nombre)}</h3></div>${descripcionHtml}${ofertaHtml}<div class="product-price">${formatPrice(p.precio)}</div>${talleSelectorHtml}<div class="flex items-center justify-between gap-2 mt-3"><div class="qty-control"><button class="qty-btn decr-qty" data-id="${p.id}">−</button><input type="number" id="${qid}" value="0" min="0" max="99" class="qty-input"><button class="qty-btn incr-qty" data-id="${p.id}">+</button></div></div><button class="add-btn add-specific-btn" data-id="${p.id}" data-nombre="${escapeHtml(p.nombre)}" data-precio="${p.precio}" data-imagen="${escapeHtml(p.imagen)}" data-categoria="${escapeHtml(p.categoria)}"><span>Agregar ✨</span></button></div></div>`; });
  grid.innerHTML = html;
  filteredProducts.forEach(p => { let inp = document.getElementById(`qty_${p.id}`); let talleSelect = document.querySelector(`.talle-select[data-id="${p.id}"]`); document.querySelector(`.incr-qty[data-id="${p.id}"]`)?.addEventListener('click', () => { let v = parseInt(inp.value) || 0; if (v < 99) inp.value = v + 1; }); document.querySelector(`.decr-qty[data-id="${p.id}"]`)?.addEventListener('click', () => { let v = parseInt(inp.value) || 0; if (v > 0) inp.value = v - 1; }); document.querySelector(`.add-specific-btn[data-id="${p.id}"]`)?.addEventListener('click', () => { let cant = parseInt(inp.value) || 0; if (cant > 0) { let talle = talleSelect ? talleSelect.value : null; let categoria = p.categoria; addToCart(p.id, p.nombre, p.precio, p.imagen, cant, talle, categoria); inp.value = 0; } }); });
}
function updateCategories() { let cats = [...new Set(allProducts.map(p => p.categoria))]; let cont = document.getElementById("categoriesFilter"); let allBtn = document.createElement('button'); allBtn.setAttribute('data-cat', 'all'); allBtn.textContent = '✨ Todos'; allBtn.className = 'cat-btn active'; cont.innerHTML = ""; cont.appendChild(allBtn); cats.forEach(c => { let btn = document.createElement('button'); btn.setAttribute('data-cat', c); btn.textContent = c; btn.className = "cat-btn"; cont.appendChild(btn); }); highlightActive(); }
function highlightActive() { document.querySelectorAll('.cat-btn').forEach(b => { let v = b.dataset.cat; if ((currentCategory === "all" && v === "all") || (currentCategory !== "all" && v === currentCategory)) b.classList.add('active'); else b.classList.remove('active'); }); }
document.getElementById("categoriesFilter").addEventListener("click", e => { let b = e.target.closest(".cat-btn"); if (b) { currentCategory = b.dataset.cat; highlightActive(); applyFiltersAndRender(); } });
document.getElementById("cartButton").addEventListener("click", () => { document.getElementById("cartOffcanvas").classList.add("open"); document.getElementById("offcanvasBackdrop").classList.add("show"); });
document.getElementById("closeCartBtn").addEventListener("click", () => { document.getElementById("cartOffcanvas").classList.remove("open"); document.getElementById("offcanvasBackdrop").classList.remove("show"); });
document.getElementById("backFromCartBtn").addEventListener("click", () => { document.getElementById("cartOffcanvas").classList.remove("open"); document.getElementById("offcanvasBackdrop").classList.remove("show"); });
document.getElementById("offcanvasBackdrop").addEventListener("click", () => { document.getElementById("cartOffcanvas").classList.remove("open"); document.getElementById("offcanvasBackdrop").classList.remove("show"); });
document.getElementById("whatsappBtn").addEventListener("click", sendWhatsApp);
document.getElementById("closeModalBtn").addEventListener("click", function(e) { e.stopPropagation(); closeImageModal(); });
updateCategories(); applyFiltersAndRender();
</script>
