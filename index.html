let filteredProducts = [], currentCategory = "all", cart = {};
function formatPrice(p){ let n=parseFloat(p); return isNaN(n)?"$0":"$"+n.toLocaleString('es-ES'); }
function escapeHtml(s){ if(!s) return ""; return s.replace(/[&<>]/g,m=>m==='&'?'&amp;':m==='<'?'&lt;':'&gt;'); }
function computeSpecialTotal() {
    let items = Object.values(cart);
    let sumOfferPrices = 0, offerUnits = 0, sumNonOffer = 0;
    for (let item of items) {
        const originalProduct = allProducts.find(p => p.id === item.idOriginal);
        const hasOffer = originalProduct && originalProduct.oferta && originalProduct.oferta.trim() !== "";
        if (hasOffer) { sumOfferPrices += item.precio * item.cantidad; offerUnits += item.cantidad; }
        else { sumNonOffer += item.precio * item.cantidad; }
    }
    let total = sumNonOffer;
    if (offerUnits > 0) total += sumOfferPrices / offerUnits;
    return total;
}
function updateCartUI(){ document.getElementById("cartCount").innerText=Object.values(cart).reduce((s,i)=>s+i.cantidad,0); renderCartOffcanvas(); }
function addToCart(id,nombre,precio,imagen,cant,talle){
    if(cant<=0) return;
    let key = talle ? id+"_"+talle : id;
    const originalProduct = allProducts.find(p => p.id === id);
    const tieneOferta = originalProduct && originalProduct.oferta && originalProduct.oferta.trim() !== "";
    if(cart[key]) cart[key].cantidad+=cant;
    else cart[key]={idOriginal:id,nombre,precio,cantidad:cant,imagen,talle:talle, tieneOferta};
    updateCartUI();
}
function removeProductFromCart(key){ if(cart[key]){ delete cart[key]; updateCartUI(); } }
function removeOneFromCart(key){ if(cart[key]){ if(cart[key].cantidad>1) cart[key].cantidad--; else delete cart[key]; updateCartUI(); } }
function renderCartOffcanvas(){
    let container=document.getElementById("cartItemsList"), items=Object.values(cart);
    if(!items.length){ container.innerHTML='<div class="text-center text-gray-400">Vacío</div>'; document.getElementById("cartTotal").innerText=formatPrice(0); document.getElementById("totalExplanation").classList.add("hidden"); return; }
    let html="", hasOfferItems=false;
    for(let [key,item] of Object.entries(cart)){
        const originalProduct = allProducts.find(p=>p.id===item.idOriginal);
        const hasOffer = originalProduct && originalProduct.oferta && originalProduct.oferta.trim()!=="";
        if(hasOffer) hasOfferItems=true;
        let talleInfo = item.talle ? " | Talle: "+escapeHtml(item.talle) : "";
        let subtotalHtml = "";
        if(hasOffer){
            subtotalHtml = '<div class="text-xs text-orange-600 mt-1">🎁 Oferta: se aplica promedio en el total</div>';
        } else {
            let sub = item.precio * item.cantidad;
            subtotalHtml = '<div class="flex justify-between items-center mt-1"><span>Cant: '+item.cantidad+'</span><span class="font-semibold">'+formatPrice(sub)+'</span></div>';
        }
        html+='<div class="flex gap-3 border-b pb-3 relative"><img src="'+escapeHtml(item.imagen)+'" class="w-16 h-16 object-cover rounded-lg"><div class="flex-1"><h4 class="font-bold pr-6">'+escapeHtml(item.nombre)+talleInfo+(hasOffer?'<span class="badge-oferta ml-2">OFERTA</span>':'')+'</h4><div class="text-sm text-gray-600">Precio unit: '+formatPrice(item.precio)+'</div>'+subtotalHtml+'<div class="flex gap-2 mt-2"><button class="text-xs bg-red-100 text-red-600 px-2 py-1 rounded remove-one-btn" data-key="'+key+'">Eliminar 1</button></div></div><button class="absolute top-0 right-0 text-red-500 font-bold text-lg remove-product-btn" data-key="'+key+'">✕</button></div>';
    }
    container.innerHTML=html;
    const totalEspecial = computeSpecialTotal();
    document.getElementById("cartTotal").innerText = formatPrice(totalEspecial);
    const expDiv = document.getElementById("totalExplanation");
    if(hasOfferItems){ expDiv.innerHTML="ℹ️ El total se calcula como: suma de productos sin oferta + (promedio por unidad de los productos con oferta)."; expDiv.classList.remove("hidden"); }
    else { expDiv.classList.add("hidden"); }
    document.querySelectorAll('.remove-one-btn').forEach(b=>b.addEventListener('click',()=>removeOneFromCart(b.dataset.key)));
    document.querySelectorAll('.remove-product-btn').forEach(b=>b.addEventListener('click',()=>removeProductFromCart(b.dataset.key)));
}
function generateWhatsAppMessage(){
    let items=Object.values(cart); if(!items.length) return null;
    let msg="¡Hola "+STORE_NAME+"! Quisiera hacer un pedido:%0A%0A";
    let totalGeneral = computeSpecialTotal();
    for(let item of items){
        const originalProduct = allProducts.find(p=>p.id===item.idOriginal);
        const hasOffer = originalProduct && originalProduct.oferta && originalProduct.oferta.trim()!=="";
        let talleTexto = item.talle ? " (Talle: "+item.talle+")" : "";
        msg+="🔹 "+item.nombre+talleTexto+"%0A   Cantidad: "+item.cantidad+" x "+formatPrice(item.precio)+"%0A";
        if(!hasOffer) msg+="   Subtotal: "+formatPrice(item.precio*item.cantidad)+"%0A";
        else msg+="   (Oferta - se promedia en el total)%0A";
        msg+="%0A";
    }
    msg+="   Total calculado (promedio ofertas + suma sin oferta): "+formatPrice(totalGeneral)+"%0A%0AEspero tu confirmación. ¡Gracias!";
    return msg;
}
function sendWhatsApp(){ let m=generateWhatsAppMessage(); if(m) window.open("https://wa.me/"+WHATSAPP_NUMBER+"?text="+m,'_blank'); else alert("Vacío"); }
function openImageModal(src){ let m=document.getElementById("imageModal"); m.style.display="flex"; document.getElementById("modalImage").src=src; }
function closeImageModal(){ document.getElementById("imageModal").style.display="none"; }
function applyFiltersAndRender(){
    let result = [...allProducts];
    if(currentCategory!=="all") result=result.filter(p=>p.categoria===currentCategory);
    filteredProducts=result;
    let grid=document.getElementById("productsGrid");
    if(!filteredProducts.length){ grid.innerHTML='<div class="col-span-full text-center py-12">Sin productos</div>'; return; }
    let html="";
    filteredProducts.forEach(p=>{ let qid="qty_"+p.id;
        let talleSelectorHtml = "";
        if(p.talles && p.talles.length>0){
            let options = p.talles.map(t=>'<option value="'+escapeHtml(t)+'">Talle '+escapeHtml(t)+'</option>').join('');
            talleSelectorHtml = '<div class="mt-2"><label class="text-xs text-gray-600">Talle:</label><select class="talle-select w-full mt-1" data-id="'+p.id+'" id="talle_'+p.id+'">'+options+'</select></div>';
        }
        let ofertaHtml = (p.oferta && p.oferta.trim()!=="") ? '<div class="oferta-texto">🎉 '+escapeHtml(p.oferta)+'</div>' : "";
        html+='<div class="bg-white rounded-2xl border shadow-sm overflow-hidden flex flex-col"><div class="bg-gray-100 h-48 cursor-pointer overflow-hidden" onclick="openImageModal(''+escapeHtml(p.imagen)+'')"><img src="'+escapeHtml(p.imagen)+'" class="w-full h-full object-cover hover:scale-105 transition"></div><div class="p-5"><div class="flex justify-between items-start gap-2 mb-2"><h3 class="font-bold">'+escapeHtml(p.nombre)+'</h3><span class="bg-indigo-50 text-indigo-700 text-xs px-2 py-1 rounded-md">'+escapeHtml(p.categoria)+'</span></div>'+ofertaHtml+'<div class="font-black text-xl text-indigo-600">'+formatPrice(p.precio)+'</div>'+talleSelectorHtml+'<div class="flex items-center justify-between gap-2 mt-4"><div class="flex bg-gray-100 rounded-lg"><button class="qty-btn decr-qty" data-id="'+p.id+'">−</button><input type="number" id="'+qid+'" value="0" min="0" max="99" class="qty-input w-12 text-center bg-transparent"><button class="qty-btn incr-qty" data-id="'+p.id+'">+</button></div><button class="add-specific-btn bg-indigo-600 hover:bg-indigo-700 text-white font-semibold py-2 px-4 rounded-xl transition-colors" data-id="'+p.id+'" data-nombre="'+escapeHtml(p.nombre)+'" data-precio="'+p.precio+'" data-imagen="'+escapeHtml(p.imagen)+'">Agregar</button></div></div></div>';
    });
    grid.innerHTML=html;
    filteredProducts.forEach(p=>{
        let inp=document.getElementById("qty_"+p.id);
        let talleSelect = document.querySelector('.talle-select[data-id="'+p.id+'"]');
        document.querySelector('.incr-qty[data-id="'+p.id+'"]')?.addEventListener('click',()=>{ let v=parseInt(inp.value)||0; if(v<99) inp.value=v+1; });
        document.querySelector('.decr-qty[data-id="'+p.id+'"]')?.addEventListener('click',()=>{ let v=parseInt(inp.value)||0; if(v>0) inp.value=v-1; });
        document.querySelector('.add-specific-btn[data-id="'+p.id+'"]')?.addEventListener('click',()=>{ let cant=parseInt(inp.value)||0; if(cant>0){ let talle = talleSelect ? talleSelect.value : null; addToCart(p.id, p.nombre, p.precio, p.imagen, cant, talle); inp.value=0; } });
    });
}
function updateCategories(){
    let cats=[...new Set(allProducts.map(p=>p.categoria))];
    let cont=document.getElementById("categoriesFilter");
    let allBtn=cont.querySelector('.cat-btn[data-cat="all"]');
    cont.innerHTML=""; cont.appendChild(allBtn);
    cats.forEach(c=>{ let btn=document.createElement('button'); btn.setAttribute('data-cat',c); btn.textContent=c; btn.className="cat-btn px-5 py-2.5 rounded-xl font-medium bg-gray-50 text-gray-600 hover:bg-gray-100"; cont.appendChild(btn); });
    highlightActive();
}
function highlightActive(){ document.querySelectorAll('.cat-btn').forEach(b=>{ let v=b.dataset.cat; if((currentCategory==="all" && v==="all")||(currentCategory!=="all" && v===currentCategory)) b.classList.add('bg-indigo-600','text-white'); else b.classList.remove('bg-indigo-600','text-white'); }); }
document.getElementById("categoriesFilter").addEventListener("click",e=>{ let b=e.target.closest(".cat-btn"); if(b){ currentCategory=b.dataset.cat; highlightActive(); applyFiltersAndRender(); } });
document.getElementById("cartButton").addEventListener("click",()=>{ document.getElementById("cartOffcanvas").classList.add("open"); document.getElementById("offcanvasBackdrop").classList.add("show"); });
document.getElementById("closeCartBtn").addEventListener("click",()=>{ document.getElementById("cartOffcanvas").classList.remove("open"); document.getElementById("offcanvasBackdrop").classList.remove("show"); });
document.getElementById("backFromCartBtn").addEventListener("click",()=>{ document.getElementById("cartOffcanvas").classList.remove("open"); document.getElementById("offcanvasBackdrop").classList.remove("show"); });
document.getElementById("offcanvasBackdrop").addEventListener("click",()=>{ document.getElementById("cartOffcanvas").classList.remove("open"); document.getElementById("offcanvasBackdrop").classList.remove("show"); });
document.getElementById("whatsappBtn").addEventListener("click",sendWhatsApp);
document.getElementById("closeModalBtn").addEventListener("click",function(e){ e.stopPropagation(); closeImageModal(); });
updateCategories(); applyFiltersAndRender();
</script>
</body>
</html>
